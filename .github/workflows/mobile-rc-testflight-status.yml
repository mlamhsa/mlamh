name: Mobile RC TestFlight Status

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-rc-testflight-status.yml"
  workflow_dispatch:

jobs:
  check-ios-testflight:
    name: Check iOS Build 12 TestFlight status
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUBMISSION_ID: 52a831a1-c32c-4ae5-9818-da8c6a958f6c
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: EAS submission status
        run: npx eas-cli@latest submit:view "$SUBMISSION_ID" --json

      - name: App Store / TestFlight status
        run: npx eas-cli@latest submit:status --platform ios --profile testflight --json --non-interactive
