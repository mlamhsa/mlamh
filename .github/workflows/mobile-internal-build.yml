name: Mobile Internal Build

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-internal-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios

jobs:
  internal-build:
    name: EAS Internal Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ozieysztwlispglupuox.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8fHyfoV7YWfed4yRhu_BOw_BtzOId8g
      EXPO_PUBLIC_API_BASE_URL: https://mlamh.net
      EXPO_PUBLIC_DEFAULT_MARKET: SA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Load persisted EAS project linkage
        shell: bash
        run: |
          project_id=$(node -e 'const app=require("./app.json"); const id=app?.expo?.extra?.eas?.projectId; if (!id) process.exit(1); process.stdout.write(id)')
          echo "EXPO_PUBLIC_EAS_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for the internal build workflow."
            exit 1
          fi

      - name: Release preflight strict
        run: npm run release:preflight:strict

      - name: Start internal EAS build
        shell: bash
        run: |
          platform="${{ github.event.inputs.platform }}"
          if [ -z "$platform" ]; then platform="android"; fi
          npx eas-cli@latest build --platform "$platform" --profile preview --non-interactive --no-wait
