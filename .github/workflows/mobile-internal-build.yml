name: Mobile Internal Build

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-internal-build.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios

jobs:
  internal-build:
    name: EAS Internal Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://ozieysztwlispglupuox.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8fHyfoV7YWfed4yRhu_BOw_BtzOId8g
      EXPO_PUBLIC_API_BASE_URL: https://mlamh.net
      EXPO_PUBLIC_DEFAULT_MARKET: SA
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for the internal build workflow."
            exit 1
          fi

      - name: Create or link EAS project
        shell: bash
        run: |
          if [ -n "$EXPO_PUBLIC_EAS_PROJECT_ID" ]; then
            npx eas-cli@latest project:init --id "$EXPO_PUBLIC_EAS_PROJECT_ID" --force --non-interactive
          else
            npx eas-cli@latest project:init --account mlamhco --force --json --non-interactive > /tmp/eas-init.json
            project_id=$(node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/eas-init.json","utf8")); const id=value?.id ?? value?.project?.id ?? value?.projectId; if (!id) process.exit(1); process.stdout.write(id)')
            echo "EXPO_PUBLIC_EAS_PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          fi

      - name: Release preflight strict
        run: npm run release:preflight:strict

      - name: Start internal EAS build
        shell: bash
        run: |
          platform="${{ github.event.inputs.platform }}"
          if [ -z "$platform" ]; then platform="android"; fi
          npx eas-cli@latest build --platform "$platform" --profile preview --non-interactive --no-wait
