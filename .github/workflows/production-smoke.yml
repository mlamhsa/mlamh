name: Production availability smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public production routes (retry once)
        env:
          SMOKE_BASE_URL: https://mlamh.net
          SMOKE_TIMEOUT_MS: '15000'
        run: |
          node scripts/production-smoke.mjs && exit 0
          echo "First attempt failed; retrying after 30 seconds"
          sleep 30
          node scripts/production-smoke.mjs
