name: Mobile B3 Polish Materialize

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - .github/workflows/mobile-b3-polish-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Apply targeted B3 polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          profile = "apps/mobile/app/profile/index.tsx"
          replace_exact(profile,
              'import { router } from "expo-router";\n',
              'import { router } from "expo-router";\nimport { Bell, Camera, Settings } from "lucide-react-native";\n')
          replace_exact(profile,
              '<Text style={styles.iconGlyph}>🔔</Text>{unreadCount > 0 ? <View style={styles.badge}><Text style={styles.badgeText}>{unreadCount > 99 ? "99+" : unreadCount}</Text></View> : null}',
              '<Bell size={20} strokeWidth={1.9} color={theme.text} />{unreadCount > 0 ? <View style={styles.badge}><Text style={styles.badgeText}>{unreadCount > 99 ? "99+" : unreadCount}</Text></View> : null}')
          replace_exact(profile,
              '<Pressable accessibilityRole="button" accessibilityLabel={isArabic ? "الإعدادات" : "Settings"} onPress={() => router.push("/profile/settings")} style={styles.iconButton}><Text style={styles.iconGlyph}>⚙︎</Text></Pressable>',
              '<Pressable accessibilityRole="button" accessibilityLabel={isArabic ? "الإعدادات" : "Settings"} onPress={() => router.push("/profile/settings")} style={styles.iconButton}><Settings size={20} strokeWidth={1.9} color={theme.text} /></Pressable>')
          replace_exact(profile,
              '<View style={styles.photoEdit}><Text style={styles.photoEditText}>＋</Text></View>',
              '<View style={styles.photoEdit}><Camera size={17} strokeWidth={2.2} color={theme.background} /></View>')

          edit = "apps/mobile/app/profile/edit.tsx"
          replace_exact(edit,
              'import { router } from "expo-router";\n',
              'import { router } from "expo-router";\nimport DateTimePicker from "@react-native-community/datetimepicker";\nimport { CalendarDays } from "lucide-react-native";\n')
          old_date = '''function DateField({value,onChange,locale,styles}:{value:string;onChange:(v:string)=>void;locale:"ar"|"en";styles:ReturnType<typeof createStyles>}){const [y="",m="",d=""]=value.split("-");const setPart=(part:"y"|"m"|"d",next:string)=>{const yy=part==="y"?next.replace(/\\D/g,"").slice(0,4):y;const mm=part==="m"?next.replace(/\\D/g,"").slice(0,2):m;const dd=part==="d"?next.replace(/\\D/g,"").slice(0,2):d;onChange([yy,mm,dd].filter((x,idx)=>x||idx===0).join("-"));};return <View style={styles.fieldWrap}><Text style={styles.label}>{locale==="ar"?"تاريخ الميلاد":"Date of birth"}</Text><View style={styles.dateRow}><TextInput value={d} onChangeText={(v)=>setPart("d",v)} placeholder={locale==="ar"?"يوم":"DD"} keyboardType="number-pad" maxLength={2} placeholderTextColor="#8F8F89" style={styles.dateInput}/><TextInput value={m} onChangeText={(v)=>setPart("m",v)} placeholder={locale==="ar"?"شهر":"MM"} keyboardType="number-pad" maxLength={2} placeholderTextColor="#8F8F89" style={styles.dateInput}/><TextInput value={y} onChangeText={(v)=>setPart("y",v)} placeholder={locale==="ar"?"سنة":"YYYY"} keyboardType="number-pad" maxLength={4} placeholderTextColor="#8F8F89" style={[styles.dateInput,styles.dateYear]}/></View><Text style={styles.helper}>{locale==="ar"?"سيتم تحويله تلقائيًا إلى الصيغة القياسية.":"Saved using the standard date format."}</Text></View>}'''
          new_date = '''function DateField({value,onChange,locale,styles}:{value:string;onChange:(v:string)=>void;locale:"ar"|"en";styles:ReturnType<typeof createStyles>}){const [open,setOpen]=useState(false);const candidate=/^\\d{4}-\\d{2}-\\d{2}$/.test(value)?new Date(`${value}T12:00:00`):null;const valid=candidate&&!Number.isNaN(candidate.getTime())?candidate:null;const selected=valid??new Date(2000,0,1);const display=valid?new Intl.DateTimeFormat(locale==="ar"?"ar-SA-u-nu-latn":"en-US",{year:"numeric",month:"long",day:"numeric"}).format(valid):(locale==="ar"?"اختر تاريخ الميلاد":"Choose date of birth");return <View style={styles.fieldWrap}><Text style={styles.label}>{locale==="ar"?"تاريخ الميلاد":"Date of birth"}</Text><Pressable accessibilityRole="button" accessibilityLabel={locale==="ar"?"اختيار تاريخ الميلاد":"Choose date of birth"} style={styles.datePickerButton} onPress={()=>setOpen(true)}><CalendarDays size={19} strokeWidth={1.9} color="#C9A962"/><Text style={styles.datePickerText}>{display}</Text></Pressable>{open?<View style={styles.datePickerPanel}><DateTimePicker value={selected} mode="date" display={Platform.OS==="ios"?"spinner":"default"} maximumDate={new Date()} minimumDate={new Date(1920,0,1)} locale={locale==="ar"?"ar-SA":"en-US"} onChange={(event,next)=>{if(event.type==="dismissed"){setOpen(false);return;}if(next){onChange(`${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,"0")}-${String(next.getDate()).padStart(2,"0")}`);}if(Platform.OS!=="ios")setOpen(false);}}/>{Platform.OS==="ios"?<Pressable style={styles.datePickerDone} onPress={()=>setOpen(false)}><Text style={styles.datePickerDoneText}>{locale==="ar"?"تم":"Done"}</Text></Pressable>:null}</View>:null}<Text style={styles.helper}>{locale==="ar"?"يُحفظ التاريخ بصيغته القياسية تلقائيًا.":"The date is saved automatically in the standard format."}</Text></View>}'''
          replace_exact(edit, old_date, new_date)
          replace_exact(edit,
              'dateRow:{flexDirection:"row",gap:8},dateInput:{flex:1,minHeight:52,borderWidth:1,borderColor:theme.border,borderRadius:14,color:theme.text,textAlign:"center",fontSize:16,backgroundColor:theme.surface},dateYear:{flex:1.45},helper:',
              'datePickerButton:{minHeight:54,borderWidth:1,borderColor:theme.border,borderRadius:14,backgroundColor:theme.surface,paddingHorizontal:15,flexDirection:"row",alignItems:"center",gap:10},datePickerText:{flex:1,color:theme.text,fontSize:16},datePickerPanel:{borderWidth:1,borderColor:theme.border,borderRadius:14,overflow:"hidden",backgroundColor:theme.surface,paddingBottom:8},datePickerDone:{alignSelf:"flex-end",minHeight:40,justifyContent:"center",paddingHorizontal:18},datePickerDoneText:{color:theme.accent,fontSize:14,fontWeight:"900"},helper:')

          detail = "apps/mobile/app/opportunities/[slug].tsx"
          replace_exact(detail,
              '{item.description || (isArabic ? "لا يوجد وصف متاح لهذه الفرصة." : "No description is available for this opportunity.")}',
              '{item.description ? normalizeDisplayText(item.description) : (isArabic ? "لا يوجد وصف متاح لهذه الفرصة." : "No description is available for this opportunity.")}')
          replace_exact(detail,
              'function formatDate(value: string | null | undefined, locale: "ar" | "en")',
              'function normalizeDisplayText(value: string) { return value.replace(/\\\\n/g, "\\n").replace(/\\r\\n/g, "\\n").trim(); }\nfunction formatDate(value: string | null | undefined, locale: "ar" | "en")')
          PY

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Validate mobile
        working-directory: apps/mobile
        run: |
          npx expo-doctor
          npm run typecheck
          npm run release:preflight

      - name: Commit validated polish and remove workflow
        run: |
          rm .github/workflows/mobile-b3-polish-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app/profile/index.tsx apps/mobile/app/profile/edit.tsx 'apps/mobile/app/opportunities/[slug].tsx' .github/workflows/mobile-b3-polish-materialize.yml
          git commit -m "feat(mobile): polish profile icons date picker and opportunity text"
          git push origin HEAD:feat/mobile-platform-phase0
