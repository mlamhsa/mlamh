name: Mobile Build 13 Live Status

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build13-live-status.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IOS_BUILD_ID: 4b24d99f-5f4b-4d1e-9546-6a247cb315a4
      ANDROID_BUILD_ID: 3cb350f7-5c7f-4b8e-977e-b6a5c946de5a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Capture exact Build 13 statuses
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$IOS_BUILD_ID" --json > /tmp/ios.json
          npx --yes eas-cli@latest build:view "$ANDROID_BUILD_ID" --json > /tmp/android.json
          node - <<'NODE'
          const fs=require('fs');
          const pick=(x)=>({id:x.id,platform:x.platform,status:x.status,appVersion:x.appVersion,appBuildVersion:x.appBuildVersion,buildProfile:x.buildProfile,distribution:x.distribution,createdAt:x.createdAt,completedAt:x.completedAt,artifacts:x.artifacts?{buildUrl:x.artifacts.buildUrl??null,applicationArchiveUrl:x.artifacts.applicationArchiveUrl??null}:null});
          const out={checkedAt:new Date().toISOString(),ios:pick(JSON.parse(fs.readFileSync('/tmp/ios.json','utf8'))),android:pick(JSON.parse(fs.readFileSync('/tmp/android.json','utf8')))};
          fs.writeFileSync('../../build13-live-status.json',JSON.stringify(out,null,2)+'\n');
          NODE
      - name: Persist status and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add build13-live-status.json
          git rm .github/workflows/mobile-build13-live-status.yml
          git commit -m "chore: record Build 13 live status and remove inspector"
          git push origin HEAD:feat/mobile-platform-phase0
