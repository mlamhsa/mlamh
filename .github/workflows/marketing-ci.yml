name: Marketing CI

on:
  push:
    branches:
      - feat/zoho-mail-marketing
      - feat/buffer-approval-channel-jobs
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Marketing tests
        run: npm run test:marketing
      - name: Build
        run: npm run build
