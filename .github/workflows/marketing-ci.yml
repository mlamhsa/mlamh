name: Marketing CI

on:
  push:
    branches:
      - feat/zoho-mail-marketing
      - feat/buffer-approval-channel-jobs
      - feat/meta-marketing-hub
      - feat/multi-country-foundation
  pull_request:
    branches: [main, feat/zoho-mail-marketing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Marketing tests
        run: npm run test:marketing
      - name: Intelligence tests
        run: npm run test:intelligence
      - name: Investor demo tests
        run: node --experimental-strip-types --test lib/intelligence/demo/investor.test.ts
      - name: Market intelligence tests
        run: node --experimental-strip-types --test lib/intelligence/markets/health.test.ts
      - name: Talent supply intelligence tests
        run: node --experimental-strip-types --test lib/intelligence/talent-supply/coverage.test.ts
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        run: npm run build
