name: Launch Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public client configuration only. No Supabase secret/service-role key is exposed.
  NEXT_PUBLIC_SUPABASE_URL: https://ozieysztwlispglupuox.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_8fHyfoV7YWfed4yRhu_BOw_BtzOId8g

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:talent
      - run: npm run test:security
      - run: npm run test:marketing
      - run: npm run test:intelligence
      - run: npm run build
