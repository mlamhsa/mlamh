name: Launch Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public client configuration only. No Supabase secret/service-role key is exposed.
  NEXT_PUBLIC_SUPABASE_URL: https://ozieysztwlispglupuox.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_8fHyfoV7YWfed4yRhu_BOw_BtzOId8g

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run test:talent
      - run: npm run test:security
      - run: npm run test:marketing
      - run: npm run test:intelligence
      - run: npm run build
      - name: Start built web app
        run: |
          node_modules/.bin/next start -p 3000 > /tmp/mlamh-next.log 2>&1 &
          echo $! > /tmp/mlamh-next.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ar/join?type=talent >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mlamh-next.log
          exit 1
      - name: Browser smoke - critical signup controls
        run: node scripts/web-critical-smoke.mjs --base-url=http://127.0.0.1:3000
      - name: Browser smoke - critical public journeys
        run: node scripts/web-critical-journeys-smoke.mjs --base-url=http://127.0.0.1:3000
