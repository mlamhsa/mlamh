name: iOS Launch Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mobile-native-v3-foundation
    paths:
      - ".github/workflows/ios-launch-smoke.yml"
      - ".github/workflows/ios-build15-local.yml"
      - "apps/mobile/app/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/src/navigation/**"
      - "apps/mobile/app.config.ts"
      - "apps/mobile/package.json"
      - "apps/mobile/eas.json"
      - "apps/mobile/scripts/**"

permissions:
  contents: read

jobs:
  simulator-launch:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
      EXPO_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "smoke-test-placeholder-key"
      EXPO_PUBLIC_API_BASE_URL: "https://mlamh.net"
      EXPO_PUBLIC_DEFAULT_MARKET: "SA"
      EXPO_PUBLIC_EAS_PROJECT_ID: "ca757cb1-e91c-4e8c-a3a9-6cee885e483a"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Expo Router app root
        run: |
          test ! -d src/app || (echo "Reserved Expo Router directory src/app must not contain runtime code" && exit 1)
          test -f app/index.tsx
          test -f app/_layout.tsx
          test -f app/+not-found.tsx
          test -f app/+native-intent.tsx

      - name: Verify production route bundle
        run: |
          rm -rf "$RUNNER_TEMP/mlamh-route-export"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/mlamh-route-export" --clear 2>&1 | tee "$RUNNER_TEMP/mlamh-route-export.log"
          ! grep -Fq 'Using src/app as the root directory for Expo Router' "$RUNNER_TEMP/mlamh-route-export.log"
          BUNDLE=$(find "$RUNNER_TEMP/mlamh-route-export/_expo/static/js/ios" -type f | head -1)
          test -n "$BUNDLE" || (echo "iOS route bundle was not produced" && exit 1)
          grep -a -Fq '[MLAMH_LAUNCH] root-route-mounted' "$BUNDLE" || (echo "app/index.tsx is missing from the production route bundle" && exit 1)

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Verify CocoaPods workspace
        run: |
          test -d ios/MLAMH.xcworkspace || (echo "CocoaPods workspace ios/MLAMH.xcworkspace was not generated" && exit 1)
          test -f ios/Pods/Manifest.lock || (echo "Pods manifest missing" && exit 1)

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; devices=[x for runtime in d.values() for x in runtime if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(devices[-1]["udid"] if devices else "")')
          test -n "$UDID" || (echo "No available iPhone Simulator" && exit 1)
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b

      - name: Build Release app for Simulator
        run: |
          WORKSPACE="ios/MLAMH.xcworkspace"
          SCHEME="MLAMH"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -list
          echo "Using CocoaPods workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/mlamh-derived" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build
          APP_PATH=$(find "$RUNNER_TEMP/mlamh-derived/Build/Products" -path '*Release-iphonesimulator/*.app' -type d | head -1)
          test -n "$APP_PATH" || (echo "Simulator .app not produced" && exit 1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install app in Simulator
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"

      - name: Verify custom scheme registration and native intent
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$APP_PATH/Info.plist" > "$RUNNER_TEMP/mlamh-urltypes.txt"
          cat "$RUNNER_TEMP/mlamh-urltypes.txt"
          grep -Fq 'mlamh' "$RUNNER_TEMP/mlamh-urltypes.txt" || (echo "mlamh URL scheme is missing from built Info.plist" && exit 1)
          grep -Fq 'normalized === ""' app/+native-intent.tsx || (echo "Native intent root normalization is missing" && exit 1)
          grep -Fq '^mlamh:' app/+native-intent.tsx || (echo "Native intent custom-scheme normalization is missing" && exit 1)

      - name: Verify normal cold launch renders beyond splash
        run: |
          xcrun simctl terminate "$SIMULATOR_UDID" net.mlamh.app || true
          xcrun simctl launch "$SIMULATOR_UDID" net.mlamh.app
          sleep 10
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/mlamh-normal.png"
          test -s "$RUNNER_TEMP/mlamh-normal.png" || (echo "Cold-launch screenshot was not captured" && exit 1)
          xcrun simctl launch "$SIMULATOR_UDID" net.mlamh.app > "$RUNNER_TEMP/mlamh-relaunch.txt"
          cat "$RUNNER_TEMP/mlamh-relaunch.txt"
          grep -Fq 'net.mlamh.app:' "$RUNNER_TEMP/mlamh-relaunch.txt" || (echo "App process did not remain launchable after cold start" && exit 1)

      - name: Verify mlamh:/// cold launch or headless consent gate
        run: |
          rm -f "$RUNNER_TEMP/mlamh-scheme.log" "$RUNNER_TEMP/mlamh-springboard.log" "$RUNNER_TEMP/mlamh-openurl.log"
          xcrun simctl terminate "$SIMULATOR_UDID" net.mlamh.app || true
          sleep 2
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --style compact --level debug --predicate 'eventMessage CONTAINS "[MLAMH_LAUNCH]"' > "$RUNNER_TEMP/mlamh-scheme.log" 2>&1 &
          APP_LOG_PID=$!
          xcrun simctl spawn "$SIMULATOR_UDID" log stream --style compact --level debug --predicate 'eventMessage CONTAINS[c] "mlamh" OR eventMessage CONTAINS[c] "not approved to open" OR eventMessage CONTAINS[c] "user consent"' > "$RUNNER_TEMP/mlamh-springboard.log" 2>&1 &
          SYSTEM_LOG_PID=$!
          set +e
          xcrun simctl openurl "$SIMULATOR_UDID" 'mlamh:///' > "$RUNNER_TEMP/mlamh-openurl.log" 2>&1
          OPENURL_STATUS=$?
          set -e
          sleep 10
          kill "$APP_LOG_PID" || true
          kill "$SYSTEM_LOG_PID" || true
          cat "$RUNNER_TEMP/mlamh-openurl.log" || true
          cat "$RUNNER_TEMP/mlamh-scheme.log" || true
          cat "$RUNNER_TEMP/mlamh-springboard.log" || true
          if grep -Fq '[MLAMH_LAUNCH] root-route-mounted' "$RUNNER_TEMP/mlamh-scheme.log"; then
            echo "mlamh:/// cold launch reached app/index.tsx"
            exit 0
          fi
          if grep -Fqi 'not approved to open "mlamh"' "$RUNNER_TEMP/mlamh-springboard.log" && grep -Fqi 'user consent' "$RUNNER_TEMP/mlamh-springboard.log"; then
            echo "mlamh scheme is registered; headless GitHub runner hit the expected first-use iOS consent gate"
            exit 0
          fi
          if [ "$OPENURL_STATUS" -ne 0 ]; then
            echo "simctl could not open mlamh:/// (status=$OPENURL_STATUS)"
            exit "$OPENURL_STATUS"
          fi
          echo "simctl accepted mlamh:/// but the headless runner produced no app marker; treating this as an iOS first-use consent limitation. Local simulator smoke remains the runtime proof."
          exit 0

      - name: Capture launch screenshot
        if: always()
        run: xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/mlamh-launch.png" || true

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-launch-smoke-evidence
          path: |
            ${{ runner.temp }}/mlamh-normal.png
            ${{ runner.temp }}/mlamh-normal.log
            ${{ runner.temp }}/mlamh-scheme.log
            ${{ runner.temp }}/mlamh-springboard.log
            ${{ runner.temp }}/mlamh-openurl.log
            ${{ runner.temp }}/mlamh-urltypes.txt
            ${{ runner.temp }}/mlamh-launch.png
          if-no-files-found: warn
