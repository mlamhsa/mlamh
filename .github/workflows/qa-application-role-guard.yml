name: QA Application Role Guard

on:
  push:
    paths:
      - '.github/workflows/qa-application-role-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add acceptance-time role validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/actions/application-status-actions.ts')
          s=p.read_text()
          def rep(old,new):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'expected 1 match, got {n}: {old[:100]!r}')
              s=s.replace(old,new,1)
          rep('.select("id, title, publisher_id")', '.select("id, title, publisher_id, opportunity_type")')
          rep('.select("id, user_id")\n    .eq("id", application.talent_id)', '.select("id, user_id, primary_role, category_slug")\n    .eq("id", application.talent_id)')
          marker='  if (talentError || !talent?.user_id) throw new Error("Talent user account not found.");\n\n'
          guard='''  if (talentError || !talent?.user_id) throw new Error("Talent user account not found.");

  if (status === "accepted") {
    const opportunityRole = String(opportunity.opportunity_type ?? "").trim().toLowerCase();
    const talentRole = String(talent.primary_role ?? talent.category_slug ?? "").trim().toLowerCase();
    if ((opportunityRole === "actor" || opportunityRole === "model") && talentRole !== opportunityRole) {
      throw new Error("This application cannot be accepted because the Talent role does not match the opportunity.");
    }
  }

'''
          rep(marker,guard)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/actions/application-status-actions.ts
          git commit -m 'fix(qa): revalidate Talent role before application acceptance'
          git push origin HEAD:main
