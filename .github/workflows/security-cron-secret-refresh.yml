name: Security Cron Secret Hardening

on:
  push:
    branches: [security-hardening-v1-cron-secrets]

permissions:
  contents: write

jobs:
  harden-cron-secrets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security-hardening-v1-cron-secrets
          persist-credentials: true
      - name: Patch cron secret comparisons
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('app/api/cron/incomplete-registration-reminders/route.ts'),
              Path('app/api/cron/talent-profile-recovery-reminders/route.ts'),
          ]

          for path in targets:
              text = path.read_text()

              if '@/lib/security/request-guards' not in text:
                  anchor = 'import { createAdminClient } from "@/lib/supabase/admin";\n'
                  if anchor not in text:
                      raise SystemExit(f'Missing import anchor in {path}')
                  text = text.replace(
                      anchor,
                      anchor + 'import { hasValidBearerSecret } from "@/lib/security/request-guards";\n',
                      1,
                  )

              old_multiline = '''  const authorization =\n    request.headers.get(\n      "authorization",\n    );\n\n  if (\n    authorization !==\n    `Bearer ${cronSecret}`\n  ) {'''
              new_multiline = '''  const authorization =\n    request.headers.get(\n      "authorization",\n    );\n\n  if (!hasValidBearerSecret(authorization, cronSecret)) {'''

              old_compact = '''  if (\n    request.headers.get("authorization") !==\n    `Bearer ${cronSecret}`\n  ) {'''
              new_compact = '''  if (!hasValidBearerSecret(\n    request.headers.get("authorization"),\n    cronSecret,\n  )) {'''

              if old_multiline in text:
                  text = text.replace(old_multiline, new_multiline, 1)
              elif old_compact in text:
                  text = text.replace(old_compact, new_compact, 1)
              elif 'hasValidBearerSecret' not in text.split('export async function GET', 1)[1]:
                  raise SystemExit(f'Missing authorization comparison in {path}')

              path.write_text(text)
          PY
      - name: Commit hardened cron routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/cron/incomplete-registration-reminders/route.ts app/api/cron/talent-profile-recovery-reminders/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "security: compare cron secrets in constant time"
          git push origin HEAD:security-hardening-v1-cron-secrets
