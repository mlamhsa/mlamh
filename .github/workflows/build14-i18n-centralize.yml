name: Build 14 I18n Centralize
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-i18n-centralize.yml]
permissions:
  contents: write
jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Apply central i18n helpers
        env:
          SCRIPT_B64: ""
        run: echo "$SCRIPT_B64" | base64 -d | python
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app
          git commit -m "mobile: centralize Latin digits and Gregorian dates"
          git push origin HEAD:feat/mobile-platform-phase0
