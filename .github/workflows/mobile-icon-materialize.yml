name: Mobile Icon Materialize

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-icon-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize and validate approved app icon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize approved icon as strict RGB PNG
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, binascii, struct, zlib

          source_b64 = ''''''
          src = zlib.decompress(base64.b64decode(source_b64))
          sw = sh = 128
          if len(src) != sw * sh * 3:
              raise SystemExit('Unexpected embedded icon payload length')

          ow = oh = 1024
          scale = 8
          scanlines = bytearray()
          for y in range(oh):
              sy = y // scale
              row = bytearray([0])
              src_row = src[sy * sw * 3:(sy + 1) * sw * 3]
              for x in range(sw):
                  px = src_row[x * 3:x * 3 + 3]
                  row.extend(px * scale)
              scanlines.extend(row)

          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', binascii.crc32(kind + payload) & 0xffffffff)

          png = bytearray(b'\x89PNG\r\n\x1a\n')
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', ow, oh, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(bytes(scanlines), 9))
          png += chunk(b'IEND', b'')
          out = Path('assets/app-icon.png')
          out.write_bytes(png)
          print(f'Wrote {out} ({len(png)} bytes)')
          PY

      - name: Verify strict PNG scanline filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct, zlib
          d = Path('assets/app-icon.png').read_bytes()
          if d[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Invalid PNG signature')
          pos = 8
          idat = bytearray()
          width = height = color_type = None
          while pos < len(d):
              n = struct.unpack('>I', d[pos:pos+4])[0]
              kind = d[pos+4:pos+8]
              payload = d[pos+8:pos+8+n]
              pos += 12 + n
              if kind == b'IHDR':
                  width, height, depth, color_type, _, _, interlace = struct.unpack('>IIBBBBB', payload)
                  if (width, height, depth, color_type, interlace) != (1024, 1024, 8, 2, 0):
                      raise SystemExit('Unexpected PNG format')
              elif kind == b'IDAT':
                  idat.extend(payload)
              elif kind == b'IEND':
                  break
          raw = zlib.decompress(bytes(idat))
          rowbytes = width * 3
          filters = {raw[y * (rowbytes + 1)] for y in range(height)}
          if not filters.issubset({0,1,2,3,4}):
              raise SystemExit(f'Invalid PNG filters: {filters}')
          print(f'PNG verified: {width}x{height}, RGB8, filters={sorted(filters)}')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Release preflight
        run: npm run release:preflight

      - name: Android native prebuild
        shell: bash
        run: |
          npx expo prebuild --clean --no-install --platform android
          rm -rf android
          git restore package.json

      - name: Mobile backend contract tests
        working-directory: .
        run: npm run test:mobile

      - name: Commit validated icon and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-icon-materialize.yml
          git add apps/mobile/assets/app-icon.png
          git commit -m "fix(mobile): materialize Jimp-safe approved app icon"
          git push origin HEAD:feat/mobile-platform-phase0
