name: Refresh vulnerable dependencies on stabilization branch

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dependency-refresh.yml
  push:
    branches:
      - fix/production-smoke-check-20261104
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'mlamhsa/mlamh' && ((github.event_name == 'pull_request' && github.head_ref == 'fix/production-smoke-check-20261104' && github.event.pull_request.head.repo.full_name == 'mlamhsa/mlamh') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/production-smoke-check-20261104'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: fix/production-smoke-check-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Update patched direct dependencies and lockfile
        run: |
          npm install --save-exact next@16.4.5 sharp@0.35.5
          npm audit fix --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency changes to stabilization branch only
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(deps): patch audited production dependencies'
          git push origin HEAD:fix/production-smoke-check-20261104
