name: Mobile Build 11 TestFlight Status

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build11-testflight-status.yml"
  workflow_dispatch:

jobs:
  inspect-testflight:
    name: Inspect Build 11 TestFlight status
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IOS_BUILD_ID: 84983607-c5fb-4ae3-b840-47b6d089847c
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ce38293e3de010b85791e01df3dda51c73c0c341

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Query iOS submissions
        shell: bash
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli@latest submit:list --platform ios --limit 10 --json --non-interactive > /tmp/eas-ios-submissions.json
          cat /tmp/eas-ios-submissions.json

      - name: Query App Store / TestFlight status
        shell: bash
        run: |
          npx eas-cli@latest submit:status --platform ios --profile testflight --json --non-interactive > /tmp/eas-testflight-status.json
          cat /tmp/eas-testflight-status.json

      - name: Upload status snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build11-testflight-status
          path: |
            /tmp/eas-ios-submissions.json
            /tmp/eas-testflight-status.json
          if-no-files-found: warn
          retention-days: 3
