name: Web Production Smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production signup controls
        run: node scripts/web-critical-smoke.mjs --base-url=https://mlamh.net
      - name: Verify production public journeys
        run: node scripts/web-critical-journeys-smoke.mjs --base-url=https://mlamh.net
