name: Mobile lockfile sync

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - apps/mobile/package.json
      - .github/workflows/mobile-lock-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        working-directory: .
        run: |
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git commit -m "chore(mobile): sync package lock"
          git push origin HEAD:feat/mobile-platform-phase0
