name: QA Public Fixes

on:
  push:
    paths:
      - ".github/workflows/qa-public-fixes.yml"

permissions:
  contents: write

jobs:
  patch-public-qa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact QA fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          talent = "app/[locale]/talent/page.tsx"
          replace_once(
              talent,
              '    ? "اكتشف مواهب معتمدة في السعودية عبر ملامح: ممثلون، مودلز، أصوات، مقدمو محتوى، صنّاع محتوى، مؤثرون، مغنون، راقصون، موسيقيون وكومبارس. ابحث حسب التخصص والمدينة والعمر والجنسية."\n    : "Discover approved talent in Saudi Arabia on MLAMH: actors, models, voice talent, presenters, creators, influencers, singers, dancers, musicians and extras. Search by role, city, age and nationality.";',
              '    ? "اكتشف ممثلين ومودلز معتمدين في السعودية عبر ملامح. ابحث حسب النوع والمدينة والعمر والجنسية للوصول إلى الموهبة المناسبة لمشروعك."\n    : "Discover approved actors and models in Saudi Arabia on MLAMH. Search by talent type, city, age and nationality to find the right fit for your project.";'
          )
          replace_once(
              talent,
              '    { href: `/${locale}/talent/category/voice_actor`, label: isRtl ? "مواهب تعليق صوتي" : "Voice Talent" },\n    { href: `/${locale}/talent/category/content_creator`, label: isRtl ? "صنّاع محتوى" : "Content Creators" },\n    { href: `/${locale}/talent/category/influencer`, label: isRtl ? "مؤثرون" : "Influencers" },\n',
              ''
          )
          replace_once(
              talent,
              '                ? "ابحث عن مواهب معتمدة بمختلف التخصصات، ثم صفِّ النتائج حسب احتياج مشروعك."\n                : "Find approved talent across multiple specialties, then filter results for your project needs."}',
              '                ? "ابحث عن ممثلين ومودلز معتمدين، ثم صفِّ النتائج حسب احتياج مشروعك."\n                : "Find approved actors and models, then filter results for your project needs."}'
          )
          replace_once(
              talent,
              '                  ? "اكتشف مواهب منشورة بمختلف التخصصات على ملامح، واستخدم الفلاتر للوصول إلى الأنسب للكاستينج والإعلانات والمحتوى والفعاليات والمشاريع الإبداعية."\n                  : "Discover published talent across multiple specialties on MLAMH and use filters to find the right fit for casting, campaigns, content, events and creative projects."}',
              '                  ? "اكتشف ممثلين ومودلز منشورين على ملامح، واستخدم الفلاتر للوصول إلى الأنسب للكاستينج والإعلانات والمحتوى والفعاليات والمشاريع الإبداعية."\n                  : "Discover published actors and models on MLAMH and use filters to find the right fit for casting, campaigns, content, events and creative projects."}'
          )

          opp = "app/[locale]/opportunities/page.tsx"
          replace_once(
              opp,
              '    if (minutes < 60) {\n      return `منذ ${minutes} ${minutes === 1 ? "دقيقة" : "دقائق"}`;\n    }\n    if (hours < 24) {\n      return `منذ ${hours} ${hours === 1 ? "ساعة" : "ساعات"}`;\n    }\n    if (days < 30) {\n      return `منذ ${days} ${days === 1 ? "يوم" : "أيام"}`;\n    }',
              '    if (minutes < 60) {\n      if (minutes === 1) return "منذ دقيقة واحدة";\n      if (minutes === 2) return "منذ دقيقتين";\n      if (minutes <= 10) return `منذ ${minutes} دقائق`;\n      return `منذ ${minutes} دقيقة`;\n    }\n    if (hours < 24) {\n      if (hours === 1) return "منذ ساعة واحدة";\n      if (hours === 2) return "منذ ساعتين";\n      if (hours <= 10) return `منذ ${hours} ساعات`;\n      return `منذ ${hours} ساعة`;\n    }\n    if (days < 30) {\n      if (days === 1) return "منذ يوم واحد";\n      if (days === 2) return "منذ يومين";\n      if (days <= 10) return `منذ ${days} أيام`;\n      return `منذ ${days} يومًا`;\n    }'
          )
          replace_once(
              opp,
              '              {isRtl\n                ? `عرض ${filteredOpportunities.length} فرصة`\n                : `Showing ${filteredOpportunities.length} opportunities`}',
              '              {isRtl\n                ? filteredOpportunities.length === 1\n                  ? "عرض فرصة واحدة"\n                  : filteredOpportunities.length === 2\n                    ? "عرض فرصتين"\n                    : filteredOpportunities.length >= 3 && filteredOpportunities.length <= 10\n                      ? `عرض ${filteredOpportunities.length} فرص`\n                      : `عرض ${filteredOpportunities.length} فرصة`\n                : `Showing ${filteredOpportunities.length} opportunities`}'
          )

          detail = "app/[locale]/opportunities/[slug]/page.tsx"
          replace_once(
              detail,
              '    detail: isRtl\n      ? `متبقي ${remainingDays} ${\n          remainingDays === 1 ? "يوم" : "أيام"\n        }`\n      : `${remainingDays} day${\n          remainingDays === 1 ? "" : "s"\n        } remaining`,',
              '    detail: isRtl\n      ? remainingDays === 1\n        ? "متبقي يوم واحد"\n        : remainingDays === 2\n          ? "متبقي يومان"\n          : remainingDays <= 10\n            ? `متبقي ${remainingDays} أيام`\n            : `متبقي ${remainingDays} يومًا`\n      : `${remainingDays} day${\n          remainingDays === 1 ? "" : "s"\n        } remaining`,'
          )
          PY

      - name: Commit QA fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'[locale]'/talent/page.tsx app/'[locale]'/opportunities/page.tsx app/'[locale]'/opportunities/'[slug]'/page.tsx
          git commit -m "fix(qa): align public talent scope and Arabic copy"
          git push origin HEAD:main
