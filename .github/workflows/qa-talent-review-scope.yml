name: QA Talent Final Hardening

on:
  push:
    paths:
      - '.github/workflows/qa-talent-review-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Talent QA guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new in replacements:
                  n=s.count(old)
                  if n != 1: raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:100]!r}')
                  s=s.replace(old,new,1)
              p.write_text(s)

          patch('lib/supabase/public-talents.ts', [
            ('const ACTIVE_PUBLIC_TALENT_ROLES = new Set(TALENT_CATEGORIES.map((category) => category.slug));\n\nfunction isActivePublicTalentRole(talent: Pick<Talent, "primary_role" | "category_slug">) {', 'const ACTIVE_PUBLIC_TALENT_ROLES: Set<string> = new Set(TALENT_CATEGORIES.map((category) => category.slug));\n\ntype ActivePublicTalentRoleShape = { primary_role?: string | null; category_slug?: string | null };\n\nfunction isActivePublicTalentRole(talent: ActivePublicTalentRoleShape) {')
          ])

          patch('lib/actions/submit-talent-profile-review.ts', [
            ('import { isValidLocale, type Locale } from "@/lib/i18n";\n', 'import { isValidLocale, type Locale } from "@/lib/i18n";\nimport { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\nimport { isActiveTalentCountryCode } from "@/lib/data/talent-active-market";\n'),
            ('  const completion = TalentProfileService.calculateCompletion(talent);\n', '  const activeRole = String(talent.primary_role ?? talent.category_slug ?? "").trim().toLowerCase();\n  const roleIsActive = TALENT_CATEGORIES.some((category) => category.slug === activeRole);\n  if (!roleIsActive || !isActiveTalentCountryCode(talent.base_country_code)) {\n    return {\n      success: false,\n      message: isArabic\n        ? "الإطلاق الحالي لملامح متاح للممثلين والمودلز المقيمين في السعودية فقط."\n        : "MLAMH is currently open to actors and models based in Saudi Arabia only.",\n    };\n  }\n\n  const completion = TalentProfileService.calculateCompletion(talent);\n')
          ])

          patch('lib/actions/review-talent.ts', [
            ('import { requireAdminAccess } from "@/lib/auth/require-admin";\n', 'import { requireAdminAccess } from "@/lib/auth/require-admin";\nimport { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\nimport { isActiveTalentCountryCode } from "@/lib/data/talent-active-market";\n'),
            ('  if (decision === "approved") {\n    const readiness = getTalentProfileReviewReadiness({', '  if (decision === "approved") {\n    const activeRole = String(talent.primary_role ?? talent.category_slug ?? "").trim().toLowerCase();\n    const roleIsActive = TALENT_CATEGORIES.some((category) => category.slug === activeRole);\n    if (!roleIsActive || !isActiveTalentCountryCode(talent.base_country_code)) {\n      return {\n        success: false,\n        message: locale === "ar"\n          ? "لا يمكن اعتماد الملف: الإطلاق الحالي متاح للممثلين والمودلز المقيمين في السعودية فقط."\n          : "The profile cannot be approved: the current launch is limited to actors and models based in Saudi Arabia.",\n      };\n    }\n\n    const readiness = getTalentProfileReviewReadiness({')
          ])

          patch('lib/actions/application-status-actions.ts', [
            ('.select("id, title, publisher_id")', '.select("id, title, publisher_id, opportunity_type")'),
            ('.select("id, user_id")\n    .eq("id", application.talent_id)', '.select("id, user_id, primary_role, category_slug")\n    .eq("id", application.talent_id)'),
            ('  if (talentError || !talent?.user_id) throw new Error("Talent user account not found.");\n\n', '  if (talentError || !talent?.user_id) throw new Error("Talent user account not found.");\n\n  if (status === "accepted") {\n    const opportunityRole = String(opportunity.opportunity_type ?? "").trim().toLowerCase();\n    const talentRole = String(talent.primary_role ?? talent.category_slug ?? "").trim().toLowerCase();\n    if ((opportunityRole === "actor" || opportunityRole === "model") && talentRole !== opportunityRole) {\n      throw new Error("This application cannot be accepted because the Talent role does not match the opportunity.");\n    }\n  }\n\n')
          ])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/supabase/public-talents.ts lib/actions/submit-talent-profile-review.ts lib/actions/review-talent.ts lib/actions/application-status-actions.ts
          git commit -m 'fix(qa): finalize Talent scope and acceptance guards'
          git push origin HEAD:main
