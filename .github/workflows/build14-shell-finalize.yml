name: Build 14 Shell Finalize
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-shell-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Finish authenticated shell navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Publisher opportunity edit always returns to the owning opportunity detail.
          p = Path('apps/mobile/app/publisher/opportunities/[id]/edit.tsx')
          t = p.read_text(encoding='utf-8')
          marker = '  function commitDate() { if (!dateField) return; const value = formatIsoDate(dateValue); if (dateField === "workDate") setWorkDate(value); else if (dateField === "applicationStartDate") setApplicationStartDate(value); else setApplicationDeadline(value); setDateField(null); }\n'
          insert = marker + '\n  function leaveEdit() { leaveAuthenticatedScreen({ pathname: "/publisher/opportunities/[id]", params: { id: String(opportunityId) } }); }\n'
          if marker in t and 'function leaveEdit()' not in t:
              t = t.replace(marker, insert)
          t = t.replace('leaveAuthenticatedScreen( { pathname: "/publisher/opportunities/[id]", params: { id: String(opportunityId) } } );', 'leaveEdit();')
          t = t.replace('<Pressable onPress={() => router.back()}><Text style={styles.backText}>', '<Pressable onPress={leaveEdit}><Text style={styles.backText}>')
          t = t.replace('<Pressable onPress={() => router.back()} style={styles.backButton}>', '<Pressable onPress={leaveEdit} style={styles.backButton}>')
          p.write_text(t, encoding='utf-8')

          # Conversation details return to the correct role inbox, never to auth/onboarding history.
          p = Path('apps/mobile/app/conversations/[id].tsx')
          t = p.read_text(encoding='utf-8')
          t = t.replace('import { ScreenSkeleton } from "@/components/ScreenSkeleton";', 'import { ScreenSkeleton } from "@/components/ScreenSkeleton";\nimport { getMobileAccountContext } from "@/lib/account";')
          t = t.replace('import { useAppLocale } from "@/lib/locale-context";', 'import { useAppLocale } from "@/lib/locale-context";\nimport { leaveAuthenticatedScreen } from "@/lib/navigation";')
          state_old = '  const [data,setData]=useState<ConversationDetailResponse|null>(null),[loading,setLoading]=useState(true),[draft,setDraft]=useState(""),[sending,setSending]=useState(false),[error,setError]=useState<string|null>(null),[live,setLive]=useState(false);'
          state_new = state_old + '\n  const [accountType,setAccountType]=useState<"talent"|"publisher">("talent");'
          t = t.replace(state_old, state_new)
          effect_marker = '  useEffect(()=>{void load();},[load]);\n'
          effect_new = effect_marker + '  useEffect(()=>{let active=true;void getMobileAccountContext().then((account)=>{if(active&&account?.type)setAccountType(account.type);}).catch(()=>undefined);return()=>{active=false;};},[]);\n  function leaveConversation(){leaveAuthenticatedScreen(accountType==="publisher"?"/publisher/messages":"/messages");}\n'
          if effect_marker in t and 'function leaveConversation()' not in t:
              t = t.replace(effect_marker, effect_new)
          t = t.replace('<Pressable onPress={()=>router.back()}><Text style={s.backText}>', '<Pressable onPress={leaveConversation}><Text style={s.backText}>')
          t = t.replace('<Pressable onPress={()=>router.back()} style={s.backButton}>', '<Pressable onPress={leaveConversation} style={s.backButton}>')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app
          git commit -m "mobile: finish authenticated shell navigation"
          git push origin HEAD:feat/mobile-platform-phase0
