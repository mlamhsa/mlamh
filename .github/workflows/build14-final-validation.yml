name: Build 14 Final Validation
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-final-validation.yml]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Typecheck
        run: npm run typecheck
      - name: Release preflight
        run: npm run release:preflight
      - name: Android native prebuild
        run: npx expo prebuild --clean --no-install --platform android
      - name: Mobile backend contract tests
        working-directory: .
        run: npm run test:mobile
