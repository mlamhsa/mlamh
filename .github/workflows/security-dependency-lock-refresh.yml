name: Security Dependency Lock Refresh

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lockfile:
    if: github.head_ref == 'security-hardening-v1-external-body-guards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched dependency manifest and lockfile
        run: |
          npm install --package-lock-only --save-exact next@16.3.5 sharp@0.35.4
          npm audit fix --package-lock-only --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload dependency files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: patched-dependency-files
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
