name: Security Dependency Lock Refresh

on:
  push:
    branches: [security-hardening-v1-external-body-guards]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/security-hardening-v1-external-body-guards'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security-hardening-v1-external-body-guards
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched dependency manifest and lockfile
        run: |
          npm install --package-lock-only --save-exact next@16.3.5 sharp@0.35.4
          npm audit fix --package-lock-only --omit=dev
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency files when changed
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: patch production dependencies"
          git push origin HEAD:security-hardening-v1-external-body-guards
