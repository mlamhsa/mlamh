name: Mobile CI

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - "apps/mobile/**"
      - "app/api/account/**"
      - "app/api/applications/**"
      - "app/api/conversations/**"
      - "app/api/mobile/**"
      - "app/api/notifications/**"
      - "app/api/opportunities/**"
      - "app/api/publisher/**"
      - "app/api/talent/**"
      - "lib/accounts/**"
      - "lib/applications/**"
      - "lib/messages/**"
      - "lib/mobile/**"
      - "lib/notifications/**"
      - "lib/opportunities/**"
      - "lib/publishers/**"
      - "lib/talents/**"
      - "package.json"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "app/api/account/**"
      - "app/api/applications/**"
      - "app/api/conversations/**"
      - "app/api/mobile/**"
      - "app/api/notifications/**"
      - "app/api/opportunities/**"
      - "app/api/publisher/**"
      - "app/api/talent/**"
      - "lib/accounts/**"
      - "lib/applications/**"
      - "lib/messages/**"
      - "lib/mobile/**"
      - "lib/notifications/**"
      - "lib/opportunities/**"
      - "lib/publishers/**"
      - "lib/talents/**"
      - "package.json"
      - ".github/workflows/mobile-ci.yml"

jobs:
  validate:
    name: Expo Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Release preflight
        run: npm run release:preflight

      - name: Mobile backend contract tests
        working-directory: .
        run: npm run test:mobile
