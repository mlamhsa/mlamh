name: EAS Build 11 Status

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/eas-build11-status.yml"
  workflow_dispatch:

jobs:
  inspect-builds:
    name: Wait for paired EAS Build 11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IOS_BUILD_ID: 84983607-c5fb-4ae3-b840-47b6d089847c
      ANDROID_BUILD_ID: 18c0e658-c978-4ccf-bc65-7ac1b03f606b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Wait for Build 11 terminal status
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          for attempt in $(seq 1 50); do
            npx eas-cli@latest build:list --limit 20 --json --non-interactive > /tmp/eas-builds.json
            node - <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync('/tmp/eas-builds.json', 'utf8'));
          const ids = new Set([process.env.IOS_BUILD_ID, process.env.ANDROID_BUILD_ID]);
          const target = builds.filter((b) => ids.has(b.id));
          fs.writeFileSync('/tmp/eas-build11.json', JSON.stringify(target, null, 2));
          const summary = target.map((b) => ({
            id: b.id,
            platform: b.platform,
            status: b.status,
            profile: b.buildProfile,
            appBuildVersion: b.appBuildVersion,
            appVersion: b.appVersion,
            gitCommitHash: b.gitCommitHash,
            createdAt: b.createdAt,
            updatedAt: b.updatedAt,
            completedAt: b.completedAt,
            artifacts: b.artifacts,
            error: b.error,
          }));
          console.log(JSON.stringify(summary, null, 2));
          if (target.length !== 2) process.exit(3);
          if (target.some((b) => ['ERRORED', 'CANCELED'].includes(b.status))) process.exit(4);
          if (target.every((b) => b.status === 'FINISHED')) process.exit(0);
          process.exit(2);
          NODE
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Both Build 11 candidates are FINISHED."
              exit 0
            fi
            if [ "$rc" -eq 4 ]; then
              echo "::error::A Build 11 candidate reached a failed terminal state."
              exit 1
            fi
            if [ "$rc" -eq 3 ]; then
              echo "::warning::Could not resolve both expected Build 11 IDs yet."
            fi
            echo "Build 11 still running; attempt ${attempt}/50."
            sleep 30
          done
          echo "::error::Timed out waiting for Build 11 terminal status."
          exit 1

      - name: Upload EAS status snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-build11-final-status
          path: /tmp/eas-build11.json
          if-no-files-found: error
          retention-days: 3
