name: Workspace QA Shortlist Privacy

on:
  push:
    branches:
      - fix/workspace-role-opportunity-idempotency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-role-opportunity-idempotency
      - name: Hide shortlist until client review stage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/[locale]/casting/status/[token]/page.tsx')
          text = path.read_text()

          project_anchor = r'(if \(!project \|\| project\.service_mode !== "managed"\) notFound\(\);\s*const projectId = Number\(project\.id\);)'
          replacement = r'\1\n  const canViewShortlist = ["shortlist_ready", "client_review", "completed"].includes(project.status);'
          text, project_count = re.subn(project_anchor, replacement, text, count=1)
          if project_count != 1:
              raise SystemExit('project insertion anchor mismatch')

          shortlist_anchor = r'adminClient\.from\("casting_shortlist"\)\.select\("id,application_id,casting_role_id,status,rank,created_at"\)\.eq\("casting_project_id", projectId\)\.order\("rank", \{ ascending: true, nullsFirst: false \}\)\.order\("created_at", \{ ascending: true \}\),'
          shortlist_replacement = 'canViewShortlist\n      ? adminClient.from("casting_shortlist").select("id,application_id,casting_role_id,status,rank,created_at").eq("casting_project_id", projectId).order("rank", { ascending: true, nullsFirst: false }).order("created_at", { ascending: true })\n      : Promise.resolve({ data: [] }),' 
          text, shortlist_count = re.subn(shortlist_anchor, shortlist_replacement, text, count=1)
          if shortlist_count != 1:
              raise SystemExit('shortlist query anchor mismatch')

          path.write_text(text)
          PY
      - name: Commit privacy guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/[locale]/casting/status/[token]/page.tsx'
          git diff --cached --check
          git commit -m "fix(workspace): hide shortlist until client review"
          git push origin HEAD:fix/workspace-role-opportunity-idempotency
