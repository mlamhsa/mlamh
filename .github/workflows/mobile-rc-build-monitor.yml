name: Mobile RC Build Monitor

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-rc-build-monitor.yml"
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor EAS RC Builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ANDROID_BUILD_ID: 20b40f74-bd2a-4de9-85dc-04606d43c60d
      IOS_BUILD_ID: e605332c-4b30-416e-95e1-1ac9e3fd30e0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for RC build monitoring."
            exit 1
          fi

      - name: Wait for Android and iOS RC builds
        shell: bash
        run: |
          set -euo pipefail
          terminal_status() {
            case "$1" in
              finished|errored|canceled) return 0 ;;
              *) return 1 ;;
            esac
          }

          for attempt in $(seq 1 100); do
            android_json=$(npx --yes eas-cli@latest build:view "$ANDROID_BUILD_ID" --json)
            ios_json=$(npx --yes eas-cli@latest build:view "$IOS_BUILD_ID" --json)
            printf '%s\n' "$android_json" > /tmp/android-build.json
            printf '%s\n' "$ios_json" > /tmp/ios-build.json

            android_status=$(printf '%s' "$android_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')
            ios_status=$(printf '%s' "$ios_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')
            echo "Attempt $attempt: Android=$android_status iOS=$ios_status"

            if terminal_status "$android_status" && terminal_status "$ios_status"; then
              break
            fi
            if [ "$attempt" -eq 100 ]; then
              echo "::error::Timed out waiting for paired EAS RC builds."
              exit 1
            fi
            sleep 30
          done

          node - <<'NODE'
          const fs = require('fs');
          let failed = false;
          for (const [platform, file] of [['Android','/tmp/android-build.json'], ['iOS','/tmp/ios-build.json']]) {
            const b = JSON.parse(fs.readFileSync(file, 'utf8'));
            const details = {
              id: b.id,
              status: b.status,
              platform: b.platform,
              appVersion: b.appVersion,
              appBuildVersion: b.appBuildVersion,
              error: b.error ?? null,
              artifacts: b.artifacts ?? null,
            };
            console.log(`${platform} RC build:`);
            console.log(JSON.stringify(details, null, 2));
            console.log(`${platform} logs: https://expo.dev/accounts/mlamhco/projects/mlamh/builds/${b.id}`);
            if (String(b.status).toLowerCase() !== 'finished') failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
