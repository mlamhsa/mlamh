name: Mobile RC Build Monitor

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-rc-build-monitor.yml"
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor EAS RC Builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ANDROID_BUILD_ID: 20ff617c-d6da-4c11-96ce-e25ca1a72eff
      IOS_BUILD_ID: aee0a0e8-e3c6-46fa-8155-fa5bde677271
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for RC build monitoring."
            exit 1
          fi

      - name: Wait for Android and iOS builds
        shell: bash
        run: |
          set -euo pipefail
          terminal_status() {
            case "$1" in
              finished|errored|canceled) return 0 ;;
              *) return 1 ;;
            esac
          }

          for attempt in $(seq 1 90); do
            android_json=$(npx --yes eas-cli@latest build:view "$ANDROID_BUILD_ID" --json)
            ios_json=$(npx --yes eas-cli@latest build:view "$IOS_BUILD_ID" --json)

            android_status=$(printf '%s' "$android_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')
            ios_status=$(printf '%s' "$ios_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')

            echo "Attempt $attempt: Android=$android_status iOS=$ios_status"

            if terminal_status "$android_status" && terminal_status "$ios_status"; then
              printf '%s\n' "$android_json" > /tmp/android-build.json
              printf '%s\n' "$ios_json" > /tmp/ios-build.json
              break
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "::error::Timed out waiting for paired EAS builds."
              exit 1
            fi
            sleep 30
          done

          node - <<'NODE'
          const fs = require('fs');
          for (const [platform, file] of [['Android','/tmp/android-build.json'], ['iOS','/tmp/ios-build.json']]) {
            const b = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(`${platform} build id: ${b.id}`);
            console.log(`${platform} status: ${b.status}`);
            console.log(`${platform} platform: ${b.platform}`);
            console.log(`${platform} app version: ${b.appVersion ?? ''}`);
            console.log(`${platform} build version: ${b.appBuildVersion ?? ''}`);
            console.log(`${platform} artifact: ${b.artifacts?.buildUrl ?? b.artifacts?.applicationArchiveUrl ?? ''}`);
            console.log(`${platform} logs: https://expo.dev/accounts/mlamhco/projects/mlamh/builds/${b.id}`);
            if (String(b.status).toLowerCase() !== 'finished') process.exitCode = 1;
          }
          NODE
