name: Mobile RC Build Monitor

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-rc-build-monitor.yml"
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor EAS RC Builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ANDROID_BUILD_ID: 20ff617c-d6da-4c11-96ce-e25ca1a72eff
      IOS_BUILD_ID: aee0a0e8-e3c6-46fa-8155-fa5bde677271
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for RC build monitoring."
            exit 1
          fi

      - name: Diagnose EAS project access
        shell: bash
        run: |
          set -uo pipefail
          npx --yes eas-cli@latest whoami || true
          npx --yes eas-cli@latest project:info || true
          echo "--- Android build lookup ---"
          npx --yes eas-cli@latest build:view "$ANDROID_BUILD_ID" --json || true
          echo "--- iOS build lookup ---"
          npx --yes eas-cli@latest build:view "$IOS_BUILD_ID" --json || true
          echo "--- Recent builds ---"
          npx --yes eas-cli@latest build:list --json --limit 10 --non-interactive || true
