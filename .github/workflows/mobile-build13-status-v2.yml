name: Mobile Build 13 Status V2

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build13-status-v2.yml"

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Read latest EAS builds
        shell: bash
        run: |
          npx eas-cli@latest build:list --platform all --limit 8 --json --non-interactive > /tmp/builds.json
          node - <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync('/tmp/builds.json','utf8'));
          builds.slice(0,8).forEach((b,i) => {
            const v = b.appVersion ?? b.metadata?.appVersion ?? b.runtimeVersion ?? 'UNKNOWN';
            const bv = b.appBuildVersion ?? b.metadata?.appBuildVersion ?? b.buildNumber ?? b.versionCode ?? 'UNKNOWN';
            console.log(`BUILD_${i+1}=platform:${b.platform}|id:${b.id}|status:${b.status}|created:${b.createdAt}|version:${v}|buildVersion:${bv}|profile:${b.buildProfile ?? 'UNKNOWN'}`);
          });
          NODE
      - name: Remove temporary workflow
        if: always()
        working-directory: .
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mobile-build13-status-v2.yml
          git commit -m "chore: remove Build 13 status v2 workflow" || exit 0
          git push origin HEAD:feat/mobile-platform-phase0
