name: QA Talent Scope Fix

on:
  push:
    paths:
      - '.github/workflows/qa-talent-scope-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining Talent scope and review guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 match, got {n}")
              p.write_text(s.replace(old, new, 1))

          p = 'app/[locale]/talent-dashboard/profile/advanced/page.tsx'
          rep(p, 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\n', 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\nimport { ACTIVE_TALENT_SIGNUP_COUNTRIES } from "@/lib/data/talent-active-market";\n')
          rep(p, '  TALENT_SIGNUP_COUNTRIES,\n', '')
          rep(p, '    () => TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode),', '    () => ACTIVE_TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode),')
          rep(p, '{TALENT_SIGNUP_COUNTRIES.map((item) => (', '{ACTIVE_TALENT_SIGNUP_COUNTRIES.map((item) => (')

          p = 'lib/actions/update-own-talent-core-details.ts'
          rep(p, 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\n', 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\nimport { getActiveTalentCountry, isActiveTalentCountryCode } from "@/lib/data/talent-active-market";\n')
          rep(p, '      .select("id, slug, primary_role, category_slug, profile_visibility")', '      .select("id, slug, primary_role, category_slug, profile_visibility, base_country_code")')
          old = '  const country = countryCode\n    ? TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode)\n    : null;\n'
          new = '  const existingCountryCode = String(talent.base_country_code ?? "").trim().toUpperCase();\n  const countryChanged = Boolean(countryCode) && countryCode !== existingCountryCode;\n  const country = countryCode\n    ? (countryChanged ? getActiveTalentCountry(countryCode) : TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode))\n    : null;\n'
          rep(p, old, new)
          rep(p, '    (countryCode && !country) ||\n', '    (countryCode && (!country || (countryChanged && !isActiveTalentCountryCode(countryCode)))) ||\n')

          p = 'lib/actions/update-own-talent-main-image.ts'
          rep(p, 'import { createServerSupabaseClient } from "@/lib/supabase/server";\n', 'import { createServerSupabaseClient } from "@/lib/supabase/server";\nimport { getEffectiveTalentApprovalStatus } from "@/lib/talent/approval-status";\n')
          old = '  const supabase = createAdminClient();\n  const { data: talent, error: talentError } = await supabase\n    .from("talents")\n    .select("id,slug,image_url")\n    .eq("user_id", user.id)\n    .maybeSingle();\n\n  if (talentError) {\n    throw new Error(`[updateOwnTalentMainImageAction:talent] ${talentError.message}`);\n  }\n  if (!talent) redirect(`/${locale}/talent-dashboard/profile`);\n'
          new = '  const supabase = createAdminClient();\n  const [talentResult, profileResult] = await Promise.all([\n    supabase.from("talents").select("id,slug,image_url").eq("user_id", user.id).maybeSingle(),\n    supabase.from("profiles").select("account_type,approval_status,profile_completed_at,onboarding_step").eq("user_id", user.id).maybeSingle(),\n  ]);\n  const talent = talentResult.data;\n  const profile = profileResult.data;\n  if (talentResult.error) throw new Error(`[updateOwnTalentMainImageAction:talent] ${talentResult.error.message}`);\n  if (profileResult.error) throw new Error(`[updateOwnTalentMainImageAction:profile] ${profileResult.error.message}`);\n  if (!talent || !profile || profile.account_type !== "talent") redirect(`/${locale}/talent-dashboard/profile`);\n  const approvalStatus = getEffectiveTalentApprovalStatus(profile);\n  if (approvalStatus === "pending" || approvalStatus === "submitted") {\n    throw new Error(locale === "ar" ? "لا يمكن تغيير الصورة الشخصية أثناء مراجعة الملف." : "The profile photo cannot be changed while the profile is under review.");\n  }\n'
          rep(p, old, new)

          p = 'lib/actions/set-own-talent-profile-image.ts'
          rep(p, 'import { createServerSupabaseClient } from "@/lib/supabase/server";\n', 'import { createServerSupabaseClient } from "@/lib/supabase/server";\nimport { getEffectiveTalentApprovalStatus } from "@/lib/talent/approval-status";\n')
          old = '  const adminClient = createAdminClient();\n  const { data: talent, error: talentError } = await adminClient\n    .from("talents")\n    .select("id, slug, image_url, gallery_images")\n    .eq("user_id", user.id)\n    .maybeSingle();\n\n  if (talentError || !talent) {\n'
          new = '  const adminClient = createAdminClient();\n  const [talentResult, profileResult] = await Promise.all([\n    adminClient.from("talents").select("id, slug, image_url, gallery_images").eq("user_id", user.id).maybeSingle(),\n    adminClient.from("profiles").select("account_type,approval_status,profile_completed_at,onboarding_step").eq("user_id", user.id).maybeSingle(),\n  ]);\n  const talent = talentResult.data;\n  const profile = profileResult.data;\n  if (talentResult.error || profileResult.error || !talent || !profile || profile.account_type !== "talent") {\n'
          rep(p, old, new)
          marker = '  const gallery = normalizeGallery(talent.gallery_images);\n'
          guard = '  const approvalStatus = getEffectiveTalentApprovalStatus(profile);\n  if (approvalStatus === "pending" || approvalStatus === "submitted") {\n    return { success: false, message: locale === "ar" ? "لا يمكن تغيير الصورة الشخصية أثناء مراجعة الملف." : "The profile photo cannot be changed while the profile is under review." };\n  }\n\n'
          rep(p, marker, guard + marker)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/'[locale]'/talent-dashboard/profile/advanced/page.tsx lib/actions/update-own-talent-core-details.ts lib/actions/update-own-talent-main-image.ts lib/actions/set-own-talent-profile-image.ts
          git commit -m 'fix(qa): enforce Saudi-only Talent editor and review guards'
          git push origin HEAD:main
