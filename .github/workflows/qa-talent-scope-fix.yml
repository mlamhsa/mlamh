name: QA Talent Scope Fix

on:
  push:
    paths:
      - '.github/workflows/qa-talent-scope-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Talent scope and review guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 match, got {n}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          p='app/[locale]/talent-dashboard/profile/advanced/page.tsx'
          rep(p, 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\n', 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\nimport { ACTIVE_TALENT_SIGNUP_COUNTRIES } from "@/lib/data/talent-active-market";\n')
          rep(p, '  TALENT_SIGNUP_COUNTRIES,\n', '')
          rep(p, '    () => TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode),', '    () => ACTIVE_TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode),')
          rep(p, '{TALENT_SIGNUP_COUNTRIES.map((item) => (', '{ACTIVE_TALENT_SIGNUP_COUNTRIES.map((item) => (')

          p='lib/actions/update-own-talent-core-details.ts'
          rep(p, 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\n', 'import { TALENT_CATEGORIES } from "@/lib/data/talent-categories";\nimport { getActiveTalentCountry, isActiveTalentCountryCode } from "@/lib/data/talent-active-market";\n')
          rep(p, '      .select("id, slug, primary_role, category_slug, profile_visibility")', '      .select("id, slug, primary_role, category_slug, profile_visibility, base_country_code")')
          rep(p, '''  const country = countryCode
    ? TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode)
    : null;
''', '''  const existingCountryCode = String(talent.base_country_code ?? "").trim().toUpperCase();
  const countryChanged = Boolean(countryCode) && countryCode !== existingCountryCode;
  const country = countryCode
    ? (countryChanged ? getActiveTalentCountry(countryCode) : TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode))
    : null;
''')
          rep(p, '''    (countryCode && !country) ||
''', '''    (countryCode && (!country || (countryChanged && !isActiveTalentCountryCode(countryCode)))) ||
''')

          p='lib/actions/update-own-talent-residence-country.ts'
          rep(p, 'import { TALENT_SIGNUP_COUNTRIES } from "@/lib/data/talent-signup";\n', 'import { getActiveTalentCountry } from "@/lib/data/talent-active-market";\n')
          rep(p, '  const country = TALENT_SIGNUP_COUNTRIES.find((item) => item.code === countryCode);', '  const country = getActiveTalentCountry(countryCode);')

          p='lib/actions/update-own-talent-main-image.ts'
          rep(p, 'import { createServerSupabaseClient } from "@/lib/supabase/server";\n', 'import { createServerSupabaseClient } from "@/lib/supabase/server";\nimport { getEffectiveTalentApprovalStatus } from "@/lib/talent/approval-status";\n')
          rep(p, '''  const supabase = createAdminClient();
  const { data: talent, error: talentError } = await supabase
    .from("talents")
    .select("id,slug,image_url")
    .eq("user_id", user.id)
    .maybeSingle();

  if (talentError) {
    throw new Error(`[updateOwnTalentMainImageAction:talent] ${talentError.message}`);
  }
  if (!talent) redirect(`/${locale}/talent-dashboard/profile`);
''', '''  const supabase = createAdminClient();
  const [talentResult, profileResult] = await Promise.all([
    supabase.from("talents").select("id,slug,image_url").eq("user_id", user.id).maybeSingle(),
    supabase.from("profiles").select("account_type,approval_status,profile_completed_at,onboarding_step").eq("user_id", user.id).maybeSingle(),
  ]);
  const talent = talentResult.data;
  const profile = profileResult.data;
  if (talentResult.error) throw new Error(`[updateOwnTalentMainImageAction:talent] ${talentResult.error.message}`);
  if (profileResult.error) throw new Error(`[updateOwnTalentMainImageAction:profile] ${profileResult.error.message}`);
  if (!talent || !profile || profile.account_type !== "talent") redirect(`/${locale}/talent-dashboard/profile`);
  const approvalStatus = getEffectiveTalentApprovalStatus(profile);
  if (approvalStatus === "pending" || approvalStatus === "submitted") {
    throw new Error(locale === "ar" ? "لا يمكن تغيير الصورة الشخصية أثناء مراجعة الملف." : "The profile photo cannot be changed while the profile is under review.");
  }
''')

          p='lib/actions/set-own-talent-profile-image.ts'
          rep(p, 'import { createServerSupabaseClient } from "@/lib/supabase/server";\n', 'import { createServerSupabaseClient } from "@/lib/supabase/server";\nimport { getEffectiveTalentApprovalStatus } from "@/lib/talent/approval-status";\n')
          rep(p, '''  const adminClient = createAdminClient();
  const { data: talent, error: talentError } = await adminClient
    .from("talents")
    .select("id, slug, image_url, gallery_images")
    .eq("user_id", user.id)
    .maybeSingle();

  if (talentError || !talent) {
''', '''  const adminClient = createAdminClient();
  const [talentResult, profileResult] = await Promise.all([
    adminClient.from("talents").select("id, slug, image_url, gallery_images").eq("user_id", user.id).maybeSingle(),
    adminClient.from("profiles").select("account_type,approval_status,profile_completed_at,onboarding_step").eq("user_id", user.id).maybeSingle(),
  ]);
  const talent = talentResult.data;
  const profile = profileResult.data;
  if (talentResult.error || profileResult.error || !talent || !profile || profile.account_type !== "talent") {
''')
          marker='''  const gallery = normalizeGallery(talent.gallery_images);
'''
          rep(p, marker, '''  const approvalStatus = getEffectiveTalentApprovalStatus(profile);
  if (approvalStatus === "pending" || approvalStatus === "submitted") {
    return { success: false, message: locale === "ar" ? "لا يمكن تغيير الصورة الشخصية أثناء مراجعة الملف." : "The profile photo cannot be changed while the profile is under review." };
  }

''' + marker)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/'[locale]'/talent-dashboard/profile/advanced/page.tsx lib/actions/update-own-talent-core-details.ts lib/actions/update-own-talent-residence-country.ts lib/actions/update-own-talent-main-image.ts lib/actions/set-own-talent-profile-image.ts
          git commit -m 'fix(qa): enforce Saudi-only Talent scope and review guards'
          git push origin HEAD:main
