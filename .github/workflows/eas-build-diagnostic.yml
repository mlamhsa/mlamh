name: EAS Build Diagnostic

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/eas-build-diagnostic.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install mobile dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Rebuild app icon from canonical brand master
        shell: bash
        run: |
          python3 -m pip install --user --quiet Pillow
          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('../../public/brand/mlamh-logo.png')
          target = Path('assets/app-icon.png')
          logo = Image.open(source)
          logo.load()
          print(f'Brand master: format={logo.format} mode={logo.mode} size={logo.size}')

          if logo.mode != 'RGBA':
              logo = logo.convert('RGBA')

          alpha = logo.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              logo = logo.crop(bbox)

          canvas_size = 1024
          safe_area = 760
          ratio = min(safe_area / logo.width, safe_area / logo.height)
          resized = logo.resize((max(1, round(logo.width * ratio)), max(1, round(logo.height * ratio))), Image.Resampling.LANCZOS)

          canvas = Image.new('RGBA', (canvas_size, canvas_size), '#2E2E2E')
          x = (canvas_size - resized.width) // 2
          y = (canvas_size - resized.height) // 2
          canvas.alpha_composite(resized, (x, y))
          canvas = canvas.convert('RGB')
          canvas.save(target, format='PNG', optimize=True, compress_level=9)

          verify = Image.open(target)
          verify.load()
          print(f'Generated icon: format={verify.format} mode={verify.mode} size={verify.size}')
          if verify.size != (1024, 1024) or verify.format != 'PNG':
              raise SystemExit('Generated app icon failed validation')
          PY
      - name: Validate Expo Doctor
        run: npx expo-doctor
      - name: Validate Android prebuild exactly
        run: npx expo prebuild --clean --no-install --platform android
      - name: Commit repaired app icon
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree --staged apps/mobile/package.json 2>/dev/null || true
          rm -rf apps/mobile/android
          git add apps/mobile/assets/app-icon.png
          if git diff --cached --quiet; then
            echo "No icon bytes changed."
            exit 1
          fi
          git commit -m "fix(mobile): regenerate valid Expo app icon"
          git push origin HEAD:feat/mobile-platform-phase0
