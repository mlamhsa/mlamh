name: EAS Build Diagnostic

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/eas-build-diagnostic.yml"

jobs:
  inspect-png:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Inspect PNG structure
        shell: bash
        run: |
          python3 <<'PY'
          import struct, zlib
          from collections import Counter
          from pathlib import Path

          p = Path('assets/app-icon.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Not a PNG signature'
          pos = 8
          idat = []
          width = height = bit_depth = color_type = interlace = None
          chunks = []
          while pos < len(data):
              length = struct.unpack('>I', data[pos:pos+4])[0]
              typ = data[pos+4:pos+8]
              payload = data[pos+8:pos+8+length]
              chunks.append((typ.decode('ascii', 'replace'), length))
              if typ == b'IHDR':
                  width, height, bit_depth, color_type, comp, filt, interlace = struct.unpack('>IIBBBBB', payload)
              elif typ == b'IDAT':
                  idat.append(payload)
              pos += 12 + length
              if typ == b'IEND': break
          print('size_bytes=', len(data))
          print('IHDR=', width, height, bit_depth, color_type, 'interlace=', interlace)
          print('chunks=', chunks)
          raw = zlib.decompress(b''.join(idat))
          print('decompressed_bytes=', len(raw))
          channels = {0:1,2:3,3:1,4:2,6:4}[color_type]
          bpp = channels * bit_depth // 8
          stride = width * bpp
          expected = height * (stride + 1)
          print('bpp=', bpp, 'stride=', stride, 'expected=', expected)
          filters = [raw[y*(stride+1)] for y in range(height) if y*(stride+1) < len(raw)]
          counts = Counter(filters)
          print('filter_counts=', sorted(counts.items()))
          invalid = [(i,f) for i,f in enumerate(filters) if f > 4]
          print('invalid_count=', len(invalid))
          print('first_invalid=', invalid[:30])
          if len(raw) != expected:
              print('LENGTH_MISMATCH')
          PY
