name: EAS Build Diagnostic

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/eas-build-diagnostic.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install mobile dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Inspect failed EAS build and phase logs
        shell: bash
        run: |
          npx eas-cli@latest build:view 302e0d14-fec4-4462-b668-12715c9f8f95 --json > /tmp/eas-build.json
          cat /tmp/eas-build.json
          node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync("/tmp/eas-build.json","utf8")); for (const u of j.logFiles||[]) console.log(u)' > /tmp/eas-log-urls.txt
          while IFS= read -r url; do
            echo "===== EAS PHASE LOG ====="
            curl --fail --silent --show-error "$url"
            echo
          done < /tmp/eas-log-urls.txt
