name: QA Refresh Lockfile

on:
  push:
    branches:
      - fix/launch-validation-lockfile

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/launch-validation-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install
        run: npm ci --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "fix(ci): synchronize package lock"
          git push origin HEAD:fix/launch-validation-lockfile
