name: Fix Build 13 Advanced Filter Forwarding

on:
  push:
    branches:
      - fix/build13-advanced-filter-forwarding
    paths:
      - ".github/workflows/build13-filter-forwarding-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build13-advanced-filter-forwarding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch getPublicTalents cache and forwarding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/supabase/public-talents.ts')
          s=p.read_text()
          old='''    heightMin,\n    heightMax,\n  } = options;'''
          new='''    heightMin,\n    heightMax,\n    language,\n    dialect,\n    skill,\n    availability,\n    readyToTravel,\n  } = options;'''
          if old not in s: raise SystemExit('destructure pattern missing')
          s=s.replace(old,new,1)
          old='''    heightMin ?? "all",\n    heightMax ?? "all",\n  ].join(":");'''
          new='''    heightMin ?? "all",\n    heightMax ?? "all",\n    normalizeSearchValue(language)?.toLowerCase() ?? "all",\n    normalizeSearchValue(dialect)?.toLowerCase() ?? "all",\n    normalizeSearchValue(skill)?.toLowerCase() ?? "all",\n    normalizeSearchValue(availability)?.toLowerCase() ?? "all",\n    readyToTravel === true ? "travel" : "all",\n  ].join(":");'''
          if old not in s: raise SystemExit('cache key pattern missing')
          s=s.replace(old,new,1)
          old='''      heightMin,\n      heightMax,\n    });'''
          new='''      heightMin,\n      heightMax,\n      language: normalizeSearchValue(language)?.toLowerCase(),\n      dialect: normalizeSearchValue(dialect)?.toLowerCase(),\n      skill: normalizeSearchValue(skill)?.toLowerCase(),\n      availability: normalizeSearchValue(availability)?.toLowerCase(),\n      readyToTravel,\n    });'''
          if old not in s: raise SystemExit('candidate forwarding pattern missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/supabase/public-talents.ts
          git diff --cached --check
          git commit -m "fix(mobile-api): forward advanced talent filters"
          git rm .github/workflows/build13-filter-forwarding-fix.yml
          git commit -m "chore: remove Build 13 filter fix workflow"
          git push origin HEAD:fix/build13-advanced-filter-forwarding
