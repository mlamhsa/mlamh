name: Build 14 Auth Backstack
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-auth-backstack.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Apply authenticated navigation fallbacks
        env:
          SCRIPT_B64: " "
        run: echo "$SCRIPT_B64" | tr -d ' ' | base64 -d | python
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app
          git commit -m "mobile: harden authenticated leaf navigation"
          git push origin HEAD:feat/mobile-platform-phase0
