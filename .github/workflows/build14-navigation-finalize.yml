name: Build 14 Navigation Finalize
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-navigation-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Apply deterministic fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path_s, pairs):
              p = Path(path_s)
              t = p.read_text(encoding='utf-8')
              for a, b in pairs:
                  t = t.replace(a, b)
              p.write_text(t, encoding='utf-8')

          edit('apps/mobile/app/talents/[slug].tsx', [
              ('import { useAppLocale } from "@/lib/locale-context";', 'import { useAppLocale } from "@/lib/locale-context";\nimport { leaveAuthenticatedScreen } from "@/lib/navigation";'),
              ('onPress={() => router.back()} style={s.primary}', 'onPress={() => leaveAuthenticatedScreen("/talents")} style={s.primary}'),
              ('onPress={() => router.back()} style={s.iconButton}', 'onPress={() => leaveAuthenticatedScreen("/talents")} style={s.iconButton}'),
          ])

          edit('apps/mobile/app/opportunities/[slug].tsx', [
              ('import { useAppLocale } from "@/lib/locale-context";', 'import { useAppLocale } from "@/lib/locale-context";\nimport { goBackOrReplace } from "@/lib/navigation";'),
              ('onPress={() => router.back()}', 'onPress={() => goBackOrReplace("/opportunities")}'),
          ])

          edit('apps/mobile/app/casting.tsx', [
              ('import { useAppLocale } from "@/lib/locale-context";', 'import { useAppLocale } from "@/lib/locale-context";\nimport { goBackOrReplace } from "@/lib/navigation";'),
              ('function latinDigits(value: string) {\n  return value\n    .replace(/[٠-٩]/g, (digit) => String("٠١٢٣٤٥٦٧٨٩".indexOf(digit)))\n    .replace(/[۰-۹]/g, (digit) => String("۰۱۲۳۴۵۶۷۸۹".indexOf(digit)));\n}', 'function latinDigits(value: string) { return toLatinDigits(value); }'),
              ('onPress={() => router.back()}', 'onPress={() => goBackOrReplace("/opportunities")}'),
          ])
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app
          git commit -m "mobile: finalize safe navigation fallbacks"
          git push origin HEAD:feat/mobile-platform-phase0
