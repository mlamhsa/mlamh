name: Build 14 Review Back
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-review-back.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Fix profile review back route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/app/profile/review.tsx')
          t=p.read_text(encoding='utf-8')
          t=t.replace('onPress={() => onboarding ? router.replace("/profile/journey") : router.back()}', 'onPress={() => onboarding ? router.replace("/profile/journey") : leaveAuthenticatedScreen("/profile")}')
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app/profile/review.tsx
          git commit -m "mobile: keep profile review inside authenticated shell"
          git push origin HEAD:feat/mobile-platform-phase0
