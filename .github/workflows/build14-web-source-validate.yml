name: Build 14 Web Source Validate

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - "app/[locale]/talent-dashboard/privacy/**"
      - "lib/actions/submit-talent-profile-review.ts"
      - "lib/talents/privacy.ts"
      - ".github/workflows/build14-web-source-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Typecheck web source
        run: npx tsc --noEmit
