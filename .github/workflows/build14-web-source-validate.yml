name: Build 14 Web Source Validate

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - "app/[locale]/talent-dashboard/privacy/**"
      - "lib/actions/submit-talent-profile-review.ts"
      - "lib/talents/privacy.ts"
      - ".github/workflows/build14-web-source-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Generate scoped TypeScript project
        run: |
          cat > tsconfig.build14-privacy.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "include": [
              "next-env.d.ts",
              "app/[locale]/talent-dashboard/privacy/page.tsx",
              "lib/actions/submit-talent-profile-review.ts",
              "lib/talents/privacy.ts"
            ],
            "exclude": [
              "node_modules",
              "**/*.test.ts",
              "**/*.test.tsx"
            ]
          }
          EOF
      - name: Typecheck Build 14 privacy source
        run: npx tsc --noEmit -p tsconfig.build14-privacy.json
