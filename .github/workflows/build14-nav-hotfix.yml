name: Build 14 Nav Hotfix
on:
  push:
    branches: [feat/mobile-platform-phase0]
    paths: [.github/workflows/build14-nav-hotfix.yml]
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Repair navigation replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('apps/mobile/app/profile/edit.tsx')
          t = p.read_text(encoding='utf-8').replace('leaveAuthenticatedScreen("troprofile")', 'leaveAuthenticatedScreen("/profile")')
          p.write_text(t, encoding='utf-8')

          p = Path('apps/mobile/app/profile/spotlight-video.tsx')
          t = p.read_text(encoding='utf-8')
          t = t.replace('onPress={() => router.back()} style={styles.iconButton}', 'onPress={() => leaveAuthenticatedScreen("/profile/media")} style={styles.iconButton}')
          p.write_text(t, encoding='utf-8')
          PY
      - name: Commit repairs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app
          git commit -m "mobile: repair authenticated navigation fallbacks"
          git push origin HEAD:feat/mobile-platform-phase0
