name: Build 14 Locale Consolidation

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/build14-locale-consolidation.yml"

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - name: Bind remaining screens to AppLocaleProvider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'apps/mobile/app/reset-password.tsx',
              'apps/mobile/app/profile/review.tsx',
              'apps/mobile/app/profile/edit.tsx',
              'apps/mobile/app/publisher/verification.tsx',
              'apps/mobile/app/publisher/setup.tsx',
              'apps/mobile/app/publisher/opportunities/[id]/edit.tsx',
              'apps/mobile/app/opportunities/[slug].tsx',
              'apps/mobile/app/casting.tsx',
          ]

          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  'import { getDeviceLocale, isRtlLocale } from "@/lib/i18n";',
                  'import { isRtlLocale } from "@/lib/i18n";\nimport { useAppLocale } from "@/lib/locale-context";',
              )
              text = text.replace(
                  '  const locale = getDeviceLocale();',
                  '  const { locale } = useAppLocale();',
                  1,
              )
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'updated {name}')
              else:
                  print(f'no change {name}')
          PY
      - name: Commit locale consolidation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No locale consolidation changes needed."
            exit 0
          fi
          git config user.name "MLAMH Build 14"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app
          git commit -m "mobile: bind remaining flows to in-app locale"
          git push origin HEAD:feat/mobile-platform-phase0
