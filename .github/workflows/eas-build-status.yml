name: EAS Build Status

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/eas-build-status.yml"

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install mobile dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Read EAS build status
        run: npx eas-cli@latest build:view a5d05971-ffdb-4454-998f-aeb84013743e --json
