name: Mobile RC TestFlight Submit

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-rc-testflight-submit.yml"
  workflow_dispatch:

jobs:
  submit-ios:
    name: Submit iOS Build 6 to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IOS_BUILD_ID: 196c57bc-353a-4c56-bc78-d6e6c1f9a50f
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for TestFlight submit."
            exit 1
          fi

      - name: Wait for iOS Build 6 to finish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            build_json=$(npx --yes eas-cli@latest build:view "$IOS_BUILD_ID" --json)
            status=$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')
            echo "Attempt $attempt: iOS=$status"
            case "$status" in
              finished) exit 0 ;;
              errored|canceled)
                echo "::error::iOS Build 6 ended with status $status."
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 100 ]; then
              echo "::error::Timed out waiting for iOS Build 6."
              exit 1
            fi
            sleep 30
          done

      - name: Submit existing iOS Build 6 to TestFlight
        run: npx eas-cli@latest submit --platform ios --id "$IOS_BUILD_ID" --profile testflight --non-interactive --wait
