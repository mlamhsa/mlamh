# Build 12 RC TestFlight submission — submit existing verified EAS build only
name: Mobile RC TestFlight Submit

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-rc-testflight-submit.yml"
  workflow_dispatch:

jobs:
  submit-ios:
    name: Submit iOS Build 12 to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IOS_BUILD_ID: c8706d16-26e6-443a-8a09-47ad9641b6da
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured for TestFlight submit."
            exit 1
          fi

      - name: Verify iOS Build 12
        shell: bash
        run: |
          set -euo pipefail
          build_json=$(npx --yes eas-cli@latest build:view "$IOS_BUILD_ID" --json)
          status=$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')
          build_version=$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.appBuildVersion||""))})')
          echo "iOS status=$status appBuildVersion=$build_version"
          if [ "$status" != "finished" ]; then
            echo "::error::Expected finished iOS Build 12, got status=$status."
            exit 1
          fi
          if [ "$build_version" != "12" ]; then
            echo "::error::Expected iOS appBuildVersion 12, got $build_version."
            exit 1
          fi

      - name: Submit existing iOS Build 12 to TestFlight
        run: npx eas-cli@latest submit --platform ios --id "$IOS_BUILD_ID" --profile testflight --non-interactive --wait
