name: Apply Mobile Build 13 QA Fixes

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build13-qa-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix talent profile type safety and compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/app/talents/[slug].tsx')
          s=p.read_text()
          s=s.replace('item.galleryImages.length ?','(item.galleryImages ?? []).length ?')
          s=s.replace('>{item.galleryImages.map((url,index)=>','>{(item.galleryImages ?? []).map((url,index)=>')
          s=s.replace('[...item.languages, ...item.dialects].map((value)=>displayToken(value,locale))','[...item.languages, ...item.dialects].map((value)=>displayToken(value,locale)).filter((value): value is string => Boolean(value))')
          s=s.replace('item.skills.map((value)=>displayToken(value,locale))','item.skills.map((value)=>displayToken(value,locale)).filter((value): value is string => Boolean(value))')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app/talents/[slug].tsx
          git diff --cached --check
          git commit -m "fix(mobile): harden Build 13 talent profile contract"
          git push origin HEAD:feat/mobile-platform-phase0
