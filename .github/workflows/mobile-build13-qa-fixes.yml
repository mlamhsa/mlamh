name: Apply Mobile Build 13 QA Fixes

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build13-qa-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/scripts/build13_patch.py
      - name: Commit Build 13 QA batch
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/app.json apps/mobile/app/publisher/index.tsx apps/mobile/app/profile/settings.tsx apps/mobile/app/notifications/index.tsx apps/mobile/app/talents/index.tsx apps/mobile/app/publisher/opportunities/new.tsx apps/mobile/app/account/phone.tsx
          git diff --cached --check
          git commit -m "fix(mobile): apply Build 13 physical QA batch"
          git push origin HEAD:feat/mobile-platform-phase0
