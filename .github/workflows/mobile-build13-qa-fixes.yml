name: Apply Mobile Build 13 QA Fixes

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build13-qa-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python .github/scripts/build13_patch2.py
      - name: Commit Build 13 talent UX batch
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/mobile/public-talent-contract.ts apps/mobile/lib/talents.ts lib/talent/public-directory-filters.ts app/api/mobile/talents/route.ts lib/supabase/public-talents.ts apps/mobile/app/talents/index.tsx apps/mobile/app/talents/[slug].tsx
          git diff --cached --check
          git commit -m "fix(mobile): complete Build 13 talent discovery UX"
          git push origin HEAD:feat/mobile-platform-phase0
