name: Mobile Build 13 Status

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build13-status.yml"

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ca757cb1-e91c-4e8c-a3a9-6cee885e483a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Read Build 13 statuses
        shell: bash
        run: |
          npx eas-cli@latest build:list --platform all --limit 20 --json --non-interactive > /tmp/builds.json
          node - <<'NODE'
          const fs = require('fs');
          const builds = JSON.parse(fs.readFileSync('/tmp/builds.json','utf8'));
          for (const platform of ['ios','android']) {
            const candidates = builds.filter(b => b.platform === platform)
              .filter(b => String(b.appBuildVersion ?? b.buildNumber ?? b.versionCode ?? '') === '13');
            const b = candidates.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];
            console.log(`${platform.toUpperCase()}_BUILD_ID=${b?.id ?? 'NOT_FOUND'}`);
            console.log(`${platform.toUpperCase()}_STATUS=${b?.status ?? 'NOT_FOUND'}`);
            console.log(`${platform.toUpperCase()}_VERSION=${b?.appVersion ?? 'UNKNOWN'}`);
            console.log(`${platform.toUpperCase()}_BUILD_VERSION=${b?.appBuildVersion ?? b?.buildNumber ?? b?.versionCode ?? 'UNKNOWN'}`);
          }
          NODE
      - name: Remove temporary status workflow
        if: always()
        working-directory: .
        run: |
          git config user.name "mlamh-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mobile-build13-status.yml
          git commit -m "chore: remove Build 13 status workflow" || exit 0
          git push origin HEAD:feat/mobile-platform-phase0
