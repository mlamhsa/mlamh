name: Mobile Build 10 Android Cert

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-build10-android-cert.yml"
  workflow_dispatch:

jobs:
  verify-cert:
    name: Verify Android Build 10 certificate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ANDROID_BUILD_ID: fde071c3-8762-4856-9017-9aaada96e184
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Validate Expo authentication
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured."
            exit 1
          fi

      - name: Wait for Android Build 10 and download APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            build_json=$(npx --yes eas-cli@latest build:view "$ANDROID_BUILD_ID" --json)
            status=$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.status||"").toLowerCase())})')
            build_version=$(printf '%s' "$build_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);process.stdout.write(String(x.appBuildVersion||""))})')
            echo "Attempt $attempt: Android status=$status appBuildVersion=$build_version"
            case "$status" in
              finished)
                if [ "$build_version" != "10" ]; then
                  echo "::error::Expected Android appBuildVersion 10, got $build_version."
                  exit 1
                fi
                printf '%s\n' "$build_json" > /tmp/android-build.json
                break
                ;;
              errored|canceled)
                echo "::error::Android Build 10 ended with status=$status."
                exit 1
                ;;
            esac
            if [ "$attempt" -eq 100 ]; then
              echo "::error::Timed out waiting for Android Build 10."
              exit 1
            fi
            sleep 30
          done

          artifact_url=$(node -e 'const x=require("/tmp/android-build.json"); process.stdout.write(String(x.artifacts?.buildUrl||x.artifacts?.applicationArchiveUrl||""))')
          if [ -z "$artifact_url" ]; then
            echo "::error::Android build artifact URL was not returned by EAS."
            exit 1
          fi
          curl --fail --location --retry 3 "$artifact_url" --output /tmp/mlamh-build10.apk
          test -s /tmp/mlamh-build10.apk

      - name: Print release signing SHA-256
        shell: bash
        run: |
          set -euo pipefail
          keytool -printcert -jarfile /tmp/mlamh-build10.apk | tee /tmp/cert.txt
          fingerprint=$(grep -E 'SHA256:' /tmp/cert.txt | head -n1 | sed -E 's/^.*SHA256:[[:space:]]*//')
          if [ -z "$fingerprint" ]; then
            echo "::error::Unable to extract SHA-256 certificate fingerprint."
            exit 1
          fi
          echo "ANDROID_BUILD10_SHA256=$fingerprint"
