name: Mobile Native UI Dependencies

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - .github/workflows/mobile-native-ui-deps.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-platform-phase0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install current dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Install Expo-compatible native UI dependencies
        working-directory: apps/mobile
        run: |
          npx expo install react-native-svg @react-native-community/datetimepicker --npm
          npm install lucide-react-native --save

      - name: Validate Expo project
        working-directory: apps/mobile
        run: |
          npx expo-doctor
          npm run typecheck
          npm run release:preflight

      - name: Commit generated dependency state and remove workflow
        run: |
          rm .github/workflows/mobile-native-ui-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json apps/mobile/package-lock.json .github/workflows/mobile-native-ui-deps.yml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore(mobile): add native icon and date picker dependencies"
          git push origin HEAD:feat/mobile-platform-phase0
