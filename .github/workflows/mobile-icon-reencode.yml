name: Mobile Icon Re-encode

on:
  push:
    branches:
      - feat/mobile-platform-phase0
    paths:
      - ".github/workflows/mobile-icon-reencode.yml"

permissions:
  contents: write
  actions: write

jobs:
  reencode-and-validate:
    name: Re-encode and validate mobile icons
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-encode icon assets as native-safe truecolor PNG
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            magick assets/app-icon.png -alpha off -type TrueColor PNG24:/tmp/app-icon.png
            magick assets/adaptive-icon-foreground.png -alpha on -type TrueColorAlpha PNG32:/tmp/adaptive-icon-foreground.png
          elif command -v convert >/dev/null 2>&1; then
            convert assets/app-icon.png -alpha off -type TrueColor PNG24:/tmp/app-icon.png
            convert assets/adaptive-icon-foreground.png -alpha on -type TrueColorAlpha PNG32:/tmp/adaptive-icon-foreground.png
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            convert assets/app-icon.png -alpha off -type TrueColor PNG24:/tmp/app-icon.png
            convert assets/adaptive-icon-foreground.png -alpha on -type TrueColorAlpha PNG32:/tmp/adaptive-icon-foreground.png
          fi
          mv /tmp/app-icon.png assets/app-icon.png
          mv /tmp/adaptive-icon-foreground.png assets/adaptive-icon-foreground.png

      - name: Verify PNG contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import struct

          expected = {
              Path('assets/app-icon.png'): 2,
              Path('assets/adaptive-icon-foreground.png'): 6,
          }
          for path, expected_color_type in expected.items():
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: invalid PNG signature')
              width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack('>IIBBBBB', data[16:29])
              if (width, height) != (1024, 1024):
                  raise SystemExit(f'{path}: expected 1024x1024, got {width}x{height}')
              if bit_depth != 8 or color_type != expected_color_type or interlace != 0:
                  raise SystemExit(f'{path}: incompatible PNG contract bit_depth={bit_depth} color_type={color_type} interlace={interlace}')
              print(f'{path}: 1024x1024 PNG color_type={color_type} OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Release preflight
        run: npm run release:preflight

      - name: Android native prebuild
        shell: bash
        run: |
          set -euo pipefail
          npx expo prebuild --clean --no-install --platform android
          rm -rf android
          git restore package.json

      - name: Mobile backend contract tests
        working-directory: .
        run: npm run test:mobile

      - name: Enable manual Mobile CI dispatch
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/mobile-ci.yml')
          text = path.read_text()
          if '  workflow_dispatch:' not in text:
              text = text.replace('on:\n', 'on:\n  workflow_dispatch:\n', 1)
              path.write_text(text)
          PY

      - name: Commit validated icon assets and remove temporary workflow
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-icon-reencode.yml
          git add .github/workflows/mobile-ci.yml apps/mobile/assets/app-icon.png apps/mobile/assets/adaptive-icon-foreground.png
          git commit -m "fix(mobile): use native-safe truecolor icon assets"
          git push origin HEAD:feat/mobile-platform-phase0

      - name: Dispatch official Mobile CI for committed HEAD
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          gh workflow run mobile-ci.yml --ref feat/mobile-platform-phase0
