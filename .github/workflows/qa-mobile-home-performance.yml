name: QA Mobile Home Performance Fix

on:
  push:
    branches:
      - fix/mobile-home-performance
    paths:
      - .github/workflows/qa-mobile-home-performance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-home-performance

      - name: Patch homepage hero loading
        run: |
          python - <<'PY'
          from pathlib import Path

          hero_path = Path('components/Hero.tsx')
          hero = hero_path.read_text()
          replacements = [
              ('"use client";\n\n', ''),
              ('import { useParams } from "next/navigation";\n\n', ''),
              ('''export function Hero({\n  locale: propLocale,\n  data,\n}: HeroProps) {\n  const params = useParams();\n\n  const locale =\n    propLocale ||\n    (params?.locale as Locale) ||\n    "ar";\n''', '''export function Hero({\n  locale: propLocale,\n  data,\n}: HeroProps) {\n  const locale = propLocale ?? "ar";\n'''),
          ]
          for old, new in replacements:
              if old not in hero:
                  raise SystemExit(f'Missing Hero anchor: {old[:80]!r}')
              hero = hero.replace(old, new, 1)
          priority_count = hero.count('                    priority\n')
          if priority_count != 3:
              raise SystemExit(f'Expected 3 desktop hero priority flags, found {priority_count}')
          hero = hero.replace('                    priority\n', '')
          hero_path.write_text(hero)

          mobile_path = Path('components/mobile/home/MobileHero.tsx')
          mobile = mobile_path.read_text()
          unoptimized_count = mobile.count('              unoptimized\n')
          if unoptimized_count != 3:
              raise SystemExit(f'Expected 3 mobile unoptimized flags, found {unoptimized_count}')
          mobile = mobile.replace('              unoptimized\n', '')
          mobile_path.write_text(mobile)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Hero.tsx components/mobile/home/MobileHero.tsx
          git commit -m "perf(home): reduce hidden hero work on mobile"
          git push origin HEAD:fix/mobile-home-performance
