name: QA Mobile Home Performance Fix

on:
  push:
    branches:
      - fix/mobile-home-performance
    paths:
      - .github/workflows/qa-mobile-home-performance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-home-performance

      - name: Normalize mobile hero formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/mobile/home/MobileHero.tsx')
          text = path.read_text()
          old = '                  sizes="35vw"\n'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 formatting anchors, found {count}')
          text = text.replace(old, '                sizes="35vw"\n')
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/mobile/home/MobileHero.tsx
          git commit -m "chore(home): normalize mobile hero formatting"
          git push origin HEAD:fix/mobile-home-performance
