name: Mobile V3 CI
# Final candidate CI validation marker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-v3-ci.yml"
  push:
    branches:
      - main
      - feat/mobile-native-v3-foundation
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-v3-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck


      - name: Shell smoke gate
        run: npm run validate:shell
